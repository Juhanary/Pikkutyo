# Supabase CLI -asetukset. Pilviprojektin asetukset (alue eu-central-1,
# kirjautumistavat, redirect-osoitteet) tehdään lisäksi Supabasen hallintapaneelissa.
project_id = "pikkutyo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
# Kirjautumislinkin paluu sivustolla: /api/auth/callback (glob sallii polun ja parametrit).
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:8080/**",
  "https://pikkutyo.fi/**",
  "https://app.pikkutyo.fi/**",
]
jwt_expiry = 3600
enable_signup = true
# Vierasvaraus: Flutter kirjautuu anonyymisti ennen ajan pitoa.
enable_anonymous_sign_ins = true

[auth.email]
enabled = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[auth.sms]
# SMS-palvelu valitaan ennen pilottia.
enabled = false

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

# Edge Functions. Molemmat tunnistavat kutsujan itse (secret-avain tai Stripen allekirjoitus),
# joten alustan JWT-tarkistus on pois päältä.
[functions.payments-worker]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
